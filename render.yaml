# Render Blueprint — деплой Felagi Flow на managed-платформы.
#
# Render не читает docker-compose.yml (он для локальной разработки). Здесь описан
# только web-сервис api: background workers (worker, scheduler) на Render требуют
# платный план, поэтому они запускаются локально и подключаются к той же Neon БД,
# что и api. Подробности: docs/deploy.md.
#
# Секреты (sync: false) вводятся в Dashboard при создании Blueprint, в git их нет.

services:
  - type: web
    name: felagi-flow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: felagi-flow-secrets
    # dockerCommand НЕ задаём: используем CMD из Dockerfile, который уже
    # слушает ${PORT:-8000} (см. backend/Dockerfile). Так мы не зависим от того,
    # раскрывает ли Render переменные в dockerCommand, и не дублируем команду.

envVarGroups:
  - name: felagi-flow-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: http://185.221.214.224:4100/v1
      - key: LLM_MODELS
        value: '["gpt-5.6-luna"]'
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # refresh-cookie ходит между vercel.app и onrender.com (cross-site) —
      # SameSite=Lax браузер в таком запросе не отправит
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO