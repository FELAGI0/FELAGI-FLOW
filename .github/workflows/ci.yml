name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: felagi
          POSTGRES_PASSWORD: felagi
          POSTGRES_DB: felagi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felagi -d felagi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy .
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://felagi:felagi@localhost:5432/felagi_test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      # 30 × 2s = 60s; compose сам ждёт healthy api (depends_on),
      # цикл страхует от медленного старта caddy/postgres
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::timeout waiting for http://localhost/healthz" >&2
          exit 1

      - name: Check front page
        run: curl -fsS http://localhost/ | grep -q "Felagi Flow"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
