[project]
name = "felagi-flow-backend"
version = "0.1.0"
description = "Felagi Flow — visual automation platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy[asyncio]==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "structlog==26.1.0",
    "anthropic==1.8.0",
    "authlib==1.8.0",
    "cryptography==50.0.1",
    "pyjwt==2.14.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "croniter==6.2.4",
    # httpx — runtime: HTTP-узел (app/engine/nodes/http.py) импортирует его в проде
    "httpx==0.28.1",
    "stripe==15.6.1",
    "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
# миграции генерирует alembic — линтить их вручную каждый раз смысла нет,
# mypy их всё равно проверяет
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 ругаются на кириллические «а/е/о/с/В» в строках, докстрингах и
# комментариях — для русскоязычного кода это сплошной шум
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# croniter и dateutil не поставляют py.typed: без этих override'ов mypy strict
# падает на import-untyped, а `# type: ignore` в проекте запрещён (CLAUDE.md).
# Типы этих библиотек всё равно не проверяются — override честнее точечного ignore
[[tool.mypy.overrides]]
module = ["croniter", "dateutil", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: требует реальный Postgres (RESTRICT/FK специфично для диалекта)"]
